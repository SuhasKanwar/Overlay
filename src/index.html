<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>Ghost</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="container">
      <div class="titlebar">
        <span class="titlebar-label">Ghost</span>
        <div class="titlebar-controls">
          <span class="ctrl-min" id="btnMin"></span>
          <span class="ctrl-close" id="btnClose"></span>
        </div>
      </div>

      <div class="chat" id="chat"></div>

      <div class="input-area">
        <div class="input-row">
          <textarea id="input" rows="1" placeholder="Ask anything..."></textarea>
          <button class="btn" id="btnScan" title="Scan (Ctrl+Shift+Alt+S)">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" />
              <circle cx="12" cy="13" r="4" />
            </svg>
          </button>
          <button class="btn btn-send" id="btnSend" title="Send">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <line x1="22" y1="2" x2="11" y2="13" />
              <polygon points="22 2 15 22 11 13 2 9 22 2" />
            </svg>
          </button>
        </div>
        <div class="status">
          <span id="statusLabel">Ready</span>
          <span>Ctrl+Shift+Alt+S scan • Ctrl+Shift+Alt+O toggle</span>
        </div>
      </div>
    </div>

    <script src="renderer.js"></script>
  </body>
</html>
